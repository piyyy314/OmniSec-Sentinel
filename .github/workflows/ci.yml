name: CI - Quantum Sentinel AI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python-quantum-engine:
    name: Quantum AI Python Engine Regression Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Zero-Dependency Pure Python Math Core & Algorithms
        run: |
          python3 -c "import sys; print(f'Python version: {sys.version}')"
          python3 quantum_ai_engine/runner.py --test

  build-and-lint-node-applet:
    name: TypeScript & Vite Applet Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck & Lint
        run: npm run lint

      - name: Build Full-Stack Production Bundle
        run: npm run build
        env:
          NODE_ENV: production
